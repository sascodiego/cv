  title: "Desarrollador de Software Senior"
  about_me: "Soy desarrollador de software con más de 7 años de experiencia, especializado en construir soluciones backend (C#/.NET, Go) y herramientas de automatización para los sectores retail y servicios. Mi experiencia fuerte está en la integración de sistemas, la integracion de pasarelas de pago y la automatización de procesos administrativos críticos mediante software de escritorio y arquitecturas distribuidas.\n\nDe forma complementaria, desarrollo soluciones IoT y software embebido en Linux (Raspberry Pi, ESP32) para el control de dispositivos en puntos de venta y entornos comerciales. Diseño e implemento herramientas pensando siempre en la confiabilidad, la seguridad por diseño y la estabilidad operativa de los sistemas en producción."

